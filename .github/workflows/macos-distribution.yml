name: Desktop distribution

on:
  push:
    branches: [main]
    paths:
      - 'packages/native/**'
      - 'packages/lua/**'
      - 'examples/solid-workspace/**'
      - 'scripts/package-solid.sh'
      - 'scripts/macos-app.sh'
      - 'scripts/app.ts'
      - 'scripts/app-manifest.ts'
      - 'scripts/app-manifest.test.ts'
      - 'scripts/check-packaged.ts'
      - 'scripts/check-native-packager.ts'
      - 'scripts/assets/**'
      - '.github/workflows/macos-distribution.yml'
      - 'bun.lock'
      - 'rust-toolchain.toml'
      - 'zed'
  workflow_dispatch:
    inputs:
      sign:
        description: Developer ID sign and notarize (requires Apple secrets)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ''
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/native/target
          key: macos-distribution-${{ runner.arch }}-${{ hashFiles('packages/native/Cargo.lock') }}
      - run: xcodebuild -downloadComponent MetalToolchain
      - run: bun install --frozen-lockfile

      - name: Import Developer ID certificate
        if: inputs.sign
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          : "${CERTIFICATE:?Missing certificate secret}"
          : "${CERTIFICATE_PASSWORD:?Missing certificate password}"
          : "${SIGNING_IDENTITY:?Missing Developer ID identity}"
          KEYCHAIN="$RUNNER_TEMP/gpuix-signing.keychain-db"
          PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$PASSWORD"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build test distribution
        if: ${{ !inputs.sign }}
        run: bash scripts/package-solid.sh

      - name: Build signed and notarized distribution
        if: inputs.sign
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARIZE: '1'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          : "${MACOS_SIGNING_IDENTITY:?Missing signing identity}"
          bash scripts/package-solid.sh

      - name: Remove signing credentials
        if: always() && inputs.sign
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          if [ -f "$RUNNER_TEMP/gpuix-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/gpuix-signing.keychain-db"
          fi

      - name: Verify the embedded executable without bundle resources
        run: bun scripts/check-packaged.ts "dist/GPUIX Solid.app/Contents/MacOS/GPUIX Solid"

      - name: Verify packaging with an isolated installed runner
        run: bun scripts/check-native-packager.ts packages/native/target/release/gpx

      - uses: actions/upload-artifact@v4
        with:
          name: GPUIX-Solid-macos-${{ runner.arch }}-${{ inputs.sign && 'notarized' || 'adhoc' }}
          path: dist/GPUIX-Solid-macos-*.zip
          if-no-files-found: error

  package-desktop:
    name: Package - ${{ matrix.platform }} x64
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-24.04
            platform: linux
            executable: GPUIX Solid
            launcher: gpx
          - host: windows-latest
            platform: windows
            executable: GPUIX Solid.exe
            launcher: gpx.exe
    runs-on: ${{ matrix.host }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ''
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/native/target
          key: desktop-distribution-${{ matrix.platform }}-${{ runner.arch }}-${{ hashFiles('packages/native/Cargo.lock') }}

      - name: Install Linux build and runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang pkg-config cmake dpkg-dev desktop-file-utils \
            libfontconfig-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libssl-dev libzstd-dev \
            libvulkan1 vulkan-validationlayers

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test manifest and payload collection
        run: bunx vitest run scripts/app-manifest.test.ts

      - name: Package the Solid workspace
        run: |
          bun run --cwd packages/native build:embedded
          cargo build --release --manifest-path packages/native/Cargo.toml --no-default-features --features lua54,quickjs --bin gpx
          ./packages/native/target/release/${{ matrix.launcher }} package examples/solid-workspace/gpuix.json --format binary

      - name: Verify packaging with an isolated installed runner
        run: bun scripts/check-native-packager.ts ./packages/native/target/release/${{ matrix.launcher }}

      - name: Test native archive and packaging code
        run: cargo test --release --manifest-path packages/native/Cargo.toml --no-default-features --features lua54,quickjs --bin gpx

      - name: Verify the embedded executable without source sidecars
        run: bun scripts/check-packaged.ts "dist/${{ matrix.executable }}"

      - name: Archive Linux executable
        if: runner.os == 'Linux'
        run: tar -czf dist/GPUIX-Solid-linux-x64.tar.gz -C dist 'GPUIX Solid'

      - name: Build Debian installer
        if: runner.os == 'Linux'
        run: ./packages/native/target/release/gpx package examples/solid-workspace/gpuix.json --format deb

      - name: Install, verify and uninstall Debian package
        if: runner.os == 'Linux'
        run: |
          dpkg-deb --info dist/gpuix-solid_*_amd64.deb
          sudo apt-get install -y ./dist/gpuix-solid_*_amd64.deb
          desktop-file-validate /usr/share/applications/gpuix-solid.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/gpuix-solid.svg
          bun scripts/check-packaged.ts /usr/bin/gpuix-solid
          sudo apt-get remove -y gpuix-solid
          test ! -e /usr/bin/gpuix-solid
          test ! -e /usr/share/applications/gpuix-solid.desktop

      - name: Archive Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath 'dist/GPUIX Solid.exe' -DestinationPath 'dist/GPUIX-Solid-windows-x64.zip' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: GPUIX-Solid-${{ matrix.platform }}-x64-unsigned
          path: |
            dist/GPUIX-Solid-${{ matrix.platform }}-x64.zip
            dist/GPUIX-Solid-${{ matrix.platform }}-x64.tar.gz
            dist/gpuix-solid_*_amd64.deb
          if-no-files-found: error
