[package]
name = "gpuix-native"
version = "0.10.0"
edition = "2021"
description = "GPUI bindings for Node.js via napi-rs"
license = "Apache-2.0"
license-file = "LICENSE"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
csscolorparser = "0.8.3"
log = "0.4"
memchr = "2"
env_logger = "0.11"
parking_lot = "0.12"
futures = "0.3"
# The retained tree is keyed by u64 ids that JS allocates as a counter, and it
# is probed on every `mark_changed` ancestor hop and once per child per frame in
# `build_virtual_list`. SipHash earns nothing on those keys.
rustc-hash = "2"

# Use the GPUI fork checked out in the zed submodule.
# Wasm cannot use the desktop gpui_platform features.
gpui = { path = "../../zed/crates/gpui", default-features = false, features = ["profiler"] }
thiserror = "2"
pulldown-cmark = { version = "0.12", default-features = false }
unicode-segmentation = "1"
web-time = "1"
# Checks fonts handed to `registerFont`; GPUI's text system aborts on malformed ones.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }

# Syntect compiles a grammar's TextMate regexes lazily, on the FIRST highlight
# of that language, on the frame thread, inside a paint. fancy-regex takes
# ~133ms for TypeScript and ~17ms for Rust. Oniguruma takes ~12ms and ~1.6ms.
#
# Oniguruma cannot build for wasm32-unknown-unknown: onig_sys compiles C, and
# that target ships no libc, so clang fails on `#include <stdlib.h>`. Do not try
# again. Syntect also rejects both engines at once, so the two sections below
# must stay exactly complementary.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
syntect = { version = "5.3", default-features = false, features = ["regex-onig"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
gpui = { path = "../../zed/crates/gpui", default-features = false, features = ["font-kit", "profiler"] }
gpui_platform = { path = "../../zed/crates/gpui_platform", default-features = false, features = ["font-kit", "wayland", "x11"] }
# Same client GPUI's image examples and Zed use. `img(SharedUri)` fetches
# through `App::http_client`; without this, GPUI's NullHttpClient fails every URL.
# The updater uses this too. Do not add crates.io `reqwest`: that is a second
# HTTP+TLS stack next to Zed's `zed-reqwest` fork.
reqwest_client = { path = "../../zed/crates/reqwest_client" }
http_client = { path = "../../zed/crates/http_client" }
semver = "1"
minisign-verify = "0.2"
tempfile = "3"
percent-encoding = "2"
time = { version = "0.3", features = ["parsing", "formatting"] }
url = { version = "2", features = ["serde"] }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
napi = { version = "3.12.7", features = ["napi8", "serde-json"] }
napi-derive = "3.6.8"
mlua = { version = "0.11", default-features = false, features = ["serialize", "send"] }
mahina = { git = "https://github.com/serialexp/lune", rev = "1b60a01f3af4013256d0b505ed8d281f80242fb5", optional = true }
# The embedded JavaScript engine, behind the `quickjs` feature. rquickjs-sys is
# patched below.
rquickjs = { version = "0.14", optional = true }
rquickjs-sys = { version = "0.14", optional = true }
# Compiles app TypeScript and JSX for QuickJS. Pinned to the oxc that Solid
# 2.0's compiler (`@solidjs/compiler`) builds on, so the two can share it.
oxc = { version = "=0.144.0", optional = true, features = ["ast_visit", "codegen", "regular_expression", "semantic", "transformer"] }
# Reads the source map Solid's compiler returns, to map positions in what
# oxc compiles from it back to the app's source.
oxc_sourcemap = { version = "8.1", optional = true }
# Solid 2.0's JSX compiler, for Solid apps. Not on crates.io, and its Rust API
# is unstable before 2.0 is final, so it is pinned to the `solid-js@2.0.0-rc.15`
# tag plus the host-independent refresh extraction on serialexp/solid.
# See docs/design/solid-refresh-compiler.patch. Without its default features
# it is the plain Rust library, with no napi or TSRX.
solidjs-compiler = { git = "https://github.com/serialexp/solid", rev = "7a236862b67c37cfda95e28ef199e9bc3251b489", default-features = false, optional = true }

# The slow half of the engine split above. fancy-regex is pure Rust, so it is
# the only Syntect engine that builds here, and the browser still pays ~133ms on
# its first TypeScript fence.
[target.'cfg(target_family = "wasm")'.dependencies]
syntect = { version = "5.3", default-features = false, features = ["regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
gpui_platform = { path = "../../zed/crates/gpui_platform", default-features = false }
js-sys = "0.3"
wasm-bindgen = "=0.2.127"
web-sys = { version = "0.3", features = ["Navigator", "Window"] }

# macOS text/graphics deps - pinned to avoid core-graphics version conflicts
# core-text 21.1.0 uses core-graphics 0.25 which conflicts with font-kit's core-graphics 0.24
[target.'cfg(target_os = "macos")'.dependencies]
gpui-tray = { version = "=0.1.4", features = ["menu-state"] }
core-text = "=21.0.0"
core-graphics = "=0.24.0"
tar = "0.4"
flate2 = "1"
# Production uses the embedded AppKit loop; tests use the native Metal renderer.
gpui_macos = { path = "../../zed/crates/gpui_macos", default-features = false, features = ["font-kit"] }

# Same crate GPUI uses. A .node cannot ship an exe manifest, so Windows DPI
# awareness is set at runtime in renderer.rs instead of via windows-manifest.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_HiDpi"] }

# Runs Lua and JavaScript apps. JavaScript apps need the QuickJS engine.
[[bin]]
name = "gpx"
required-features = ["quickjs"]

[features]
# test-support is default so published binaries include TestGpuixRenderer,
# letting users write GPU-backed tests for their apps.
default = ["test-support", "lua54"]
test-support = ["gpui/test-support", "gpui_platform/test-support", "gpui_macos/test-support", "gpui_macos/font-kit"]
lua54 = ["mlua/lua54", "mlua/vendored"]
luajit = ["mlua/luajit", "mlua/vendored"]
mahina-experiment = ["dep:mahina"]
# The QuickJS engine (quickjs-ng through rquickjs). Not in wasm builds.
# - map-hash-mix: quickjs-ng takes Map and Set buckets from the low bits of a
#   hash whose low bits are constant for small integers and object pointers,
#   so those maps degrade towards linear scans. Solid's `For` keys a Map by
#   both: reversing 10,000 rows takes 75 ms without the fix and 13 ms with it.
# - source-position: lets the runtime map stack trace positions in compiled
#   app modules back to their source, even for a stack overflow.
# - disable-assertions: quickjs-ng's C asserts are on unless this is set. The
#   vendored Lua builds without API checks too.
quickjs = ["dep:rquickjs", "rquickjs/disable-assertions", "rquickjs/loader", "dep:rquickjs-sys", "rquickjs-sys/map-hash-mix", "rquickjs-sys/source-position", "dep:oxc", "dep:oxc_sourcemap", "dep:solidjs-compiler"]

# rquickjs-sys 0.14.0 with vendor/rquickjs-sys-0.14.0-map-hash-mix.diff and
# vendor/rquickjs-sys-0.14.0-source-position.diff applied, behind its
# `map-hash-mix` and `source-position` features. See vendor/README.md.
[patch.crates-io]
gpui = { path = "../../zed/crates/gpui" }
gpui-tray = { path = "vendor/gpui-tray" }
rquickjs-sys = { path = "vendor/rquickjs-sys" }

[build-dependencies]
napi-build = "2.4.4"

# Only the serialization bench needs a MessagePack codec. Keep it out of the
# shipped addon: the wire format is still JSON until the bench says otherwise.
[dev-dependencies]
rmp-serde = "1.3"

[[example]]
name = "hello"
path = "examples/hello.rs"

[[example]]
name = "bench_serde"
path = "examples/bench_serde.rs"

[[example]]
name = "bench_mahina"
required-features = ["mahina-experiment"]

[profile.release]
lto = true

# capture_screenshot encodes a png on every visual test. The encoder is
# too slow at opt-level 0 and vitest kills the worker, so build the
# image crates with opt-level 3 in debug builds too.
[profile.dev.package.png]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3
